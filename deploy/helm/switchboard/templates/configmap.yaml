apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "switchboard.fullname" . }}
  labels:
    {{- include "switchboard.labels" . | nindent 4 }}
data:
  PORT: "8080"
  HOST: "0.0.0.0"
  SWITCHBOARD_HOME: "/opt/switchboard"
  SWITCHBOARD_TRUST_PROXY: {{ .Values.trustProxy | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  SWITCHBOARD_EVALUATION: {{ .Values.evaluation | quote }}
  SWITCHBOARD_PROMETHEUS: {{ .Values.metrics.prometheus | quote }}
  {{- with .Values.publicUrl }}
  SWITCHBOARD_PUBLIC_URL: {{ . | quote }}
  {{- end }}
  {{- with (.Values.otel.endpoint | default .Values.metrics.otlpEndpoint) }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.otel.protocol }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ . | quote }}
  {{- end }}
  {{- with .Values.otel.serviceName }}
  OTEL_SERVICE_NAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.otel.resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: {{ include "switchboard.keyValueList" . | quote }}
  {{- end }}
  {{- with .Values.otel.exporters.traces }}
  OTEL_TRACES_EXPORTER: {{ . | quote }}
  {{- end }}
  {{- with .Values.otel.exporters.metrics }}
  OTEL_METRICS_EXPORTER: {{ . | quote }}
  {{- end }}
  {{- with .Values.otel.exporters.logs }}
  OTEL_LOGS_EXPORTER: {{ . | quote }}
  {{- end }}
  {{- with .Values.otel.sampler }}
  OTEL_TRACES_SAMPLER: {{ . | quote }}
  {{- end }}
  {{- with .Values.otel.samplerArg }}
  OTEL_TRACES_SAMPLER_ARG: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.otel.metricExportIntervalMs }}
  OTEL_METRIC_EXPORT_INTERVAL: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.otel.compression }}
  OTEL_EXPORTER_OTLP_COMPRESSION: {{ . | quote }}
  {{- end }}
  {{- with .Values.bootstrapAdmin }}
  SWITCHBOARD_BOOTSTRAP_ADMIN: {{ . | quote }}
  {{- end }}
  {{- if .Values.oidc.issuer }}
  SWITCHBOARD_OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  SWITCHBOARD_OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  SWITCHBOARD_OIDC_ALLOWED_DOMAINS: {{ join "," .Values.oidc.allowedDomains | quote }}
  {{- end }}
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
