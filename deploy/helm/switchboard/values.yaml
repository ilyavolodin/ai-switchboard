# Default values for the AI Switchboard chart.
# Postgres is supplied by the operator; the chart never runs a database.

# Two replicas give zero-downtime rollouts; replicas coordinate through Postgres.
replicaCount: 2

image:
  repository: ghcr.io/ai-switchboard/switchboard
  # Defaults to the chart's appVersion.
  tag: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

# Public base URL (webhook and callback URLs, OIDC redirects), e.g. https://switchboard.example.com
publicUrl: ''

database:
  # Required: an existing Secret holding the Postgres connection string.
  existingSecret: ''
  existingSecretKey: DATABASE_URL

oidc:
  # Leave issuer empty only for evaluation installs (local admin password, printed to the log).
  issuer: ''
  clientId: ''
  allowedDomains: []
  clientSecret:
    existingSecret: ''
    key: SWITCHBOARD_OIDC_CLIENT_SECRET

# Email of the first admin, who signs in through OIDC.
bootstrapAdmin: ''

# Evaluation mode: local admin password, unauthenticated webhooks allowed. Never in production.
evaluation: false

logLevel: info

# Trust X-Forwarded-* headers (client IP for rate limits and audit, https detection). Right behind
# an ingress or load balancer that sets them; set false when clients reach the Service directly
# (service.type LoadBalancer/NodePort without a proxy), or they can spoof their address.
trustProxy: true

metrics:
  # Serve /metrics in Prometheus exposition format.
  prometheus: true
  # Deprecated: use otel.endpoint (still honoured when otel.endpoint is empty).
  otlpEndpoint: ''

# OpenTelemetry export of traces, metrics and logs (the standard OTEL_* variables; see
# docs/observability.md). Nothing is exported until an endpoint is set.
otel:
  # OTLP base URL; the SDK appends /v1/traces, /v1/metrics and /v1/logs (HTTP), e.g.
  # http://otel-collector.observability:4318, or :4317 with protocol grpc.
  endpoint: ''
  # http/protobuf (default), http/json or grpc.
  protocol: http/protobuf
  serviceName: switchboard
  # Extra resource attributes, e.g. { deployment.environment.name: production }. service.version
  # and service.instance.id (the pod name) are set by Switchboard.
  resourceAttributes: {}
  # Per signal: '' (otlp when an endpoint is set), otlp, console, none, or a list (otlp,console).
  exporters:
    traces: ''
    metrics: ''
    logs: ''
  # always_on, always_off, traceidratio, parentbased_always_on (default),
  # parentbased_always_off, parentbased_traceidratio; samplerArg is the ratio.
  sampler: ''
  samplerArg: ''
  # How often metrics are pushed, in milliseconds (default 30000).
  metricExportIntervalMs: ''
  # gzip or none.
  compression: ''
  # Export headers (vendor API keys), as an existing Secret key holding the whole
  # OTEL_EXPORTER_OTLP_HEADERS value, e.g. "x-honeycomb-team=abc123" or
  # "Authorization=Basic%20base64(instance:token)". Never put keys in values.
  headers:
    existingSecret: ''
    key: OTEL_EXPORTER_OTLP_HEADERS

# Extra plain environment variables (rendered into the ConfigMap), e.g. SWITCHBOARD_WORKERS: "true".
env: {}

# Raw EnvVar entries appended to the container, e.g. values for the `env` secret provider:
#   - name: GITHUB_TOKEN
#     valueFrom: { secretKeyRef: { name: switchboard-secrets, key: GITHUB_TOKEN } }
extraEnv: []

# Raw EnvFromSource entries, e.g. - secretRef: { name: switchboard-secrets }
extraEnvFrom: []

# Optional chart-managed Secret, exposed to the container with envFrom. Prefer an external
# secret manager; this exists for small installs.
secret:
  create: false
  data: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

podDisruptionBudget:
  # Rendered only when replicaCount > 1 (a PDB on one replica blocks node drains).
  enabled: true
  minAvailable: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
    - host: switchboard.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: switchboard-tls
  #    hosts: [switchboard.example.com]

serviceMonitor:
  # Requires the Prometheus Operator CRDs.
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

serviceAccount:
  create: true
  name: ''
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  # $SWITCHBOARD_HOME (/opt/switchboard) is written by `switchboard plugins add`; keep the root
  # filesystem writable, or set this to true and mount plugins.volume at /opt/switchboard.
  readOnlyRootFilesystem: false

plugins:
  # Plugins are best baked into the image (SWITCHBOARD_PLUGINS build argument). Set a volume to
  # mount a prepared $SWITCHBOARD_HOME (/opt/switchboard) instead; it replaces the image's copy,
  # including plugins baked in with SWITCHBOARD_PLUGINS (the reference plugins are unaffected).
  # e.g. { emptyDir: {} } or a PVC shared by all replicas:
  #   volume: { persistentVolumeClaim: { claimName: switchboard-plugins } }
  volume: {}

# Extra volumes, e.g. for the `file` secrets provider:
#   extraVolumes:
#     - name: switchboard-secrets
#       secret: { secretName: switchboard-secrets }
#   extraVolumeMounts:
#     - name: switchboard-secrets
#       mountPath: /var/run/secrets/switchboard
#       readOnly: true
extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

terminationGracePeriodSeconds: 30
