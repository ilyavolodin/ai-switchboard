# Postgres is supplied by the operator; the chart never runs a database.

replicaCount: 2

image:
  repository: ghcr.io/ai-switchboard/switchboard
  # Defaults to the chart's appVersion.
  tag: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

# Public base URL (webhook and callback URLs, OIDC redirects), e.g. https://switchboard.example.com
publicUrl: ''

database:
  # Required: an existing Secret holding the Postgres connection string.
  existingSecret: ''
  existingSecretKey: DATABASE_URL

oidc:
  # Leave issuer empty only for evaluation installs (local admin password, printed to the log).
  issuer: ''
  clientId: ''
  allowedDomains: []
  # Accept an ID token whose email the issuer does not mark verified (email_verified). Such a
  # sign-in never links to an account that has a password. Only for issuers that never send it.
  trustUnverifiedEmail: false
  clientSecret:
    existingSecret: ''
    key: SWITCHBOARD_OIDC_CLIENT_SECRET

bootstrapAdmin: ''

# Evaluation mode: local admin password, unauthenticated webhooks allowed. Never in production.
evaluation: false

logLevel: info

# Trust X-Forwarded-* headers. Set false when clients reach the Service directly (no proxy),
# or they can spoof their address.
trustProxy: true

metrics:
  prometheus: true
  # Deprecated: use otel.endpoint (still honoured when otel.endpoint is empty).
  otlpEndpoint: ''

# OpenTelemetry export (the standard OTEL_* variables). Nothing is exported until an endpoint is set.
otel:
  # OTLP base URL, e.g. http://otel-collector.observability:4318, or :4317 with protocol grpc.
  endpoint: ''
  # http/protobuf (default), http/json or grpc.
  protocol: http/protobuf
  serviceName: switchboard
  # service.version and service.instance.id (the pod name) are set by Switchboard.
  resourceAttributes: {}
  # Per signal: '' (otlp when an endpoint is set), otlp, console, none, or a list (otlp,console).
  exporters:
    traces: ''
    metrics: ''
    logs: ''
  # always_on, always_off, traceidratio, parentbased_always_on (default),
  # parentbased_always_off, parentbased_traceidratio; samplerArg is the ratio.
  sampler: ''
  samplerArg: ''
  # Milliseconds (default 30000).
  metricExportIntervalMs: ''
  compression: ''
  # An existing Secret key holding the whole OTEL_EXPORTER_OTLP_HEADERS value (vendor API keys).
  headers:
    existingSecret: ''
    key: OTEL_EXPORTER_OTLP_HEADERS

# Plain environment variables, rendered into the ConfigMap.
env: {}

# Raw EnvVar entries appended to the container, e.g. values for the `env` secret provider:
#   - name: GITHUB_TOKEN
#     valueFrom: { secretKeyRef: { name: switchboard-secrets, key: GITHUB_TOKEN } }
extraEnv: []

extraEnvFrom: []

# Chart-managed Secret exposed with envFrom, for small installs; prefer an external secret manager.
secret:
  create: false
  data: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

podDisruptionBudget:
  # Rendered only when replicaCount > 1 (a PDB on one replica blocks node drains).
  enabled: true
  minAvailable: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
    - host: switchboard.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: switchboard-tls
  #    hosts: [switchboard.example.com]

serviceMonitor:
  # Requires the Prometheus Operator CRDs.
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

serviceAccount:
  create: true
  name: ''
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  # $SWITCHBOARD_HOME (/opt/switchboard) is written by `switchboard plugins add`; keep the root
  # filesystem writable, or set this to true and mount plugins.volume at /opt/switchboard.
  readOnlyRootFilesystem: false

plugins:
  # Prefer baking plugins into the image (SWITCHBOARD_PLUGINS build argument). A volume mounted at
  # $SWITCHBOARD_HOME replaces the image's copy, including baked-in plugins (not the reference ones).
  volume: {}

# Extra volumes, e.g. for the `file` secrets provider:
#   extraVolumes:
#     - name: switchboard-secrets
#       secret: { secretName: switchboard-secrets }
#   extraVolumeMounts:
#     - name: switchboard-secrets
#       mountPath: /var/run/secrets/switchboard
#       readOnly: true
extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

terminationGracePeriodSeconds: 30
