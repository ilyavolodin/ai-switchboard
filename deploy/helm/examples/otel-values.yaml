# OpenTelemetry export through an in-cluster collector, with a vendor API key in a Secret.
#
#   kubectl create secret generic switchboard-otel \
#     --from-literal=OTEL_EXPORTER_OTLP_HEADERS='x-honeycomb-team=<api key>'
#   helm upgrade --install switchboard deploy/helm/switchboard -f my-values.yaml \
#     -f deploy/helm/examples/otel-values.yaml
#
# Pointing straight at a vendor instead of a collector works the same way: set endpoint to the
# vendor's OTLP URL (docs/observability.md lists Grafana Cloud, Datadog, Honeycomb, New Relic).
otel:
  endpoint: http://otel-collector.observability:4318
  protocol: http/protobuf
  serviceName: switchboard
  resourceAttributes:
    deployment.environment.name: production
    service.namespace: automation
  # Keep one trace in four (a trace sent with a sampled traceparent is always kept).
  sampler: parentbased_traceidratio
  samplerArg: '0.25'
  headers:
    existingSecret: switchboard-otel
    key: OTEL_EXPORTER_OTLP_HEADERS

metrics:
  # A collector receives the metrics over OTLP; keep /metrics for a Prometheus that scrapes pods.
  prometheus: true
