# Integration / e2e stack: throwaway Postgres, Switchboard in evaluation mode, and the stub.
#
#   docker compose -f deploy/docker-compose.test.yml up -d --build --wait
#   docker compose -f deploy/docker-compose.test.yml --profile replicas up -d --build --wait
#   docker compose -f deploy/docker-compose.test.yml down -v
#
# Inside the network the stub is http://stub:9090 and Switchboard is http://switchboard:8080.
name: switchboard-test

x-switchboard: &switchboard
  image: ghcr.io/ai-switchboard/switchboard:test
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
    stub:
      condition: service_healthy
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:8080/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
      ]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 20s

x-switchboard-env: &switchboard-env
  SWITCHBOARD_EVALUATION: 'true'
  SWITCHBOARD_PROMETHEUS: 'true'
  DATABASE_URL: postgres://switchboard:switchboard@postgres:5432/switchboard
  LOG_LEVEL: debug
  WEBHOOK_SECRET: test-webhook-secret
  STUB_CALLBACK_SECRET: test-callback-secret
  ROUTINE_TOKEN: test-routine-token

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: switchboard
      POSTGRES_PASSWORD: switchboard
      POSTGRES_DB: switchboard
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U switchboard -d switchboard']
      interval: 2s
      timeout: 5s
      retries: 30

  stub:
    image: ghcr.io/ai-switchboard/switchboard-stub:test
    build:
      context: ./stub
    environment:
      STUB_PORT: '9090'
      STUB_CALLBACK_SECRET: test-callback-secret
    ports:
      - '9090:9090'

  switchboard:
    <<: *switchboard
    environment:
      <<: *switchboard-env
      SWITCHBOARD_PUBLIC_URL: http://switchboard:8080
      SWITCHBOARD_REPLICA_ID: replica-1
    ports:
      - '8080:8080'

  # A second replica on the same database: proves the job queue yields no duplicate runs.
  switchboard-2:
    <<: *switchboard
    profiles: [replicas]
    environment:
      <<: *switchboard-env
      SWITCHBOARD_PUBLIC_URL: http://switchboard-2:8080
      SWITCHBOARD_REPLICA_ID: replica-2
    ports:
      - '8081:8080'
