# Evaluation profile: Switchboard + Postgres on one machine.
#
#   docker compose -f deploy/docker-compose.yml up -d                  # Switchboard + Postgres
#   docker compose -f deploy/docker-compose.yml --profile stub up -d   # plus the test stub
#   docker compose -f deploy/docker-compose.yml logs switchboard | grep -i password
#   docker compose -f deploy/docker-compose.yml --env-file deploy/observability.env up -d  # plus Grafana on :3000
#
# Evaluation mode is for trying Switchboard out; production uses OIDC and the Helm chart.
name: switchboard

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: switchboard
      POSTGRES_PASSWORD: switchboard
      POSTGRES_DB: switchboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U switchboard -d switchboard']
      interval: 5s
      timeout: 5s
      retries: 20

  switchboard:
    image: ghcr.io/ai-switchboard/switchboard:1.0.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Space-separated npm specs baked into the image, e.g. "@acme/switchboard-source-jira@^1".
        SWITCHBOARD_PLUGINS: ''
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SWITCHBOARD_EVALUATION: 'true'
      DATABASE_URL: postgres://switchboard:switchboard@postgres:5432/switchboard
      SWITCHBOARD_PUBLIC_URL: http://localhost:${SWITCHBOARD_PORT:-8080}
      LOG_LEVEL: info
      # OpenTelemetry export is off unless an endpoint is set.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=evaluation}
      # Resolved by the `env` secret provider (secret://env/<NAME>). Change them before exposing this.
      WEBHOOK_SECRET: change-me-webhook-secret
      STUB_CALLBACK_SECRET: change-me-callback-secret
    ports:
      - '${SWITCHBOARD_PORT:-8080}:8080'
    volumes:
      - switchboard-home:/opt/switchboard

  stub:
    profiles: [stub]
    image: ghcr.io/ai-switchboard/switchboard-stub:1.0.0
    build:
      context: ./stub
    restart: unless-stopped
    environment:
      STUB_PORT: '9090'
      STUB_CALLBACK_SECRET: change-me-callback-secret
    ports:
      - '9090:9090'

  # Not for production: one container, anonymous admin access to Grafana.
  lgtm:
    profiles: [observability]
    image: grafana/otel-lgtm:0.34.0
    restart: unless-stopped
    ports:
      - '${LGTM_GRAFANA_PORT:-3000}:3000'
    volumes:
      - lgtm-data:/data
      - ./grafana/switchboard-dashboard.json:/otel-lgtm/switchboard-dashboard.json:ro
      - ./grafana/lgtm-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/switchboard.yaml:ro

volumes:
  pgdata:
  switchboard-home:
  lgtm-data:
