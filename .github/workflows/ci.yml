name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  check:
    name: Typecheck, lint, format, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Enable corepack (setup-node toolchain)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration tests (Postgres via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Enable corepack (setup-node toolchain)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The plugin-host test loads plugins the way an install does: through the SDK's dist.
      - run: pnpm --filter @ai-switchboard/sdk build
      # Docker is available on ubuntu runners; Testcontainers starts Postgres.
      - run: pnpm test:integration

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build switchboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: ghcr.io/ai-switchboard/switchboard:ci
          cache-from: type=gha,scope=switchboard
          cache-to: type=gha,mode=max,scope=switchboard
      - name: Build stub image
        uses: docker/build-push-action@v6
        with:
          context: deploy/stub
          push: false
          load: true
          tags: ghcr.io/ai-switchboard/switchboard-stub:ci
          cache-from: type=gha,scope=stub
          cache-to: type=gha,mode=max,scope=stub
      - name: Smoke-test the CLI in the image
        run: docker run --rm --entrypoint switchboard ghcr.io/ai-switchboard/switchboard:ci --version
      - name: Validate compose files
        run: |
          docker compose -f deploy/docker-compose.yml --profile stub config -q
          docker compose -f deploy/docker-compose.test.yml --profile replicas config -q

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/switchboard --strict --set database.existingSecret=switchboard-db
      - run: |
          helm template ci deploy/helm/switchboard \
            --set database.existingSecret=switchboard-db \
            --set ingress.enabled=true \
            --set serviceMonitor.enabled=true \
            --set secret.create=true > /dev/null
