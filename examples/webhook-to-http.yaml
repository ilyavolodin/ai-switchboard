# Wire one thing: a signed webhook starts one HTTP call.
#
# The 0.1 quick-start setup, against the stub server from deploy/docker-compose.yml
# (`docker compose -f deploy/docker-compose.yml --profile stub up -d`). The Compose file sets
# WEBHOOK_SECRET for the switchboard container, which the `env` secret provider resolves.
#
#   switchboard apply -f examples/webhook-to-http.yaml --reason "quick start" --dry-run
#   switchboard apply -f examples/webhook-to-http.yaml --reason "quick start"
#
# Then send a signed test delivery through the stub (see docs/quick-start.md).
#
# Plugins: @ai-switchboard/source-webhook, executor-http, secrets-env (all baked into the image).
apiVersion: switchboard/v1
kind: Configuration

settings:
  timezone: UTC

secretProviders:
  - name: env
    type: env
    enabled: true
    settings: {}

sources:
  - name: Stub alerts
    type: webhook
    enabled: true
    settings:
      verification: hmac
      secret: secret://env/WEBHOOK_SECRET
      signatureHeader: x-signature-256
      signaturePrefix: sha256=
      algorithm: sha256
      signatureEncoding: hex
      eventTypes:
        - type: webhook.alert.fired
          title: Alert fired
          description: The stub (or any sender) reports an alert for a service.
          attributes:
            - { name: service, type: string, description: Service the alert is about }
            - { name: severity, type: string, description: 'info, warning or critical' }
            - { name: message, type: string }
          example: { service: checkout, severity: critical, message: Error rate above 5% }
      # JSONata over { body, headers, query }. The stub's /send body is
      # { id, type, service, severity, message, occurredAt }.
      mapping: |
        {
          "type": "webhook.alert.fired",
          "artifact": { "kind": "alert", "id": body.id },
          "attributes": {
            "service": body.service,
            "severity": body.severity,
            "message": body.message
          },
          "occurredAt": body.occurredAt
        }
    caps:
      eventCapPerHour: 1000

executors:
  - name: Stub HTTP
    type: http
    enabled: true
    settings:
      baseUrl: http://stub:9090
      headers: {}
      usageDimensions:
        - { id: duration_seconds, title: Duration, unit: seconds, aggregate: sum, budgetable: true }
        - {
            id: response_bytes,
            title: Response size,
            unit: bytes,
            aggregate: sum,
            budgetable: false,
          }
        - { id: cost_usd, title: Cost, unit: usd, aggregate: sum, budgetable: true }
    caps:
      runsPerDay: 500

processes:
  - name: Alert to stub
    description: Every critical alert from the stub starts one HTTP call to the stub's /exec.
    enabled: true
    triggers:
      - id: t1
        source: Stub alerts
        eventTypes: [webhook.alert.fired]
        filter: attributes.severity = 'critical'
        describe: A critical alert fired
        enabled: true
    schedules: []
    batching: { debounceSeconds: 5, maxSize: 20, maxAgeSeconds: 60 }
    gates:
      approval: none
      breaker: { threshold: 3, cooldownMinutes: 30 }
    budgets:
      runsPerHour: 30
      runsPerDay: 200
      usagePerDay: { cost_usd: 5 }
      meterCeilings: {}
    executor:
      instance: Stub HTTP
      target:
        method: POST
        url: /exec
        tracking: sync
        idempotent: false
        usageFrom: '{ "cost_usd": response.body.usage.cost_usd }'
        timeoutSeconds: 10
    input: |
      {
        "mode": mode,
        "runId": run.id,
        "alerts": events.{ "id": artifact.id, "service": attributes.service, "message": attributes.message }
      }
    before: []
    after: []
    notify: []
    trackingDeadlineMinutes: 10
