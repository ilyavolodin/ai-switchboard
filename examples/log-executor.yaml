# Try the pipeline with no backend at all: a webhook source feeds a process bound to the
# log executor, which writes every run to the server log. A sweep every five minutes starts a
# run even without events.
#
#   switchboard apply -f examples/log-executor.yaml --reason "try it out"
#
# Send a delivery (HMAC-signed with WEBHOOK_SECRET, e.g. through the stub's /send), or wait for
# the sweep, then watch: docker compose -f deploy/docker-compose.yml logs -f switchboard | grep "log executor"
#
# To try failures, edit the process target: outcome error (breaker), rate_limited (soft-hold),
# held (paused), failed (definitive), or set delayMs to see a run in flight.
apiVersion: switchboard/v1
kind: Configuration

secretProviders:
  - name: env
    type: env
    enabled: true
    settings: {}

sources:
  - name: Test webhook
    type: webhook
    enabled: true
    settings:
      verification: hmac
      secret: secret://env/WEBHOOK_SECRET
      eventTypes:
        - type: webhook.item.created
          title: Item created
          description: Anything that POSTs JSON with an id.
          attributes:
            - { name: title, type: string }
            - { name: priority, type: string }
          example: { title: Hello, priority: high }
      mapping: |
        {
          "type": "webhook.item.created",
          "artifact": { "kind": "item", "id": $string(body.id) },
          "attributes": { "title": body.title, "priority": body.priority }
        }

executors:
  - name: Log
    type: log
    enabled: true
    settings:
      level: info
      hourlyLimit: 20
    caps:
      meterPollSeconds: 60

processes:
  - name: Log everything
    description: Every item becomes one logged run; a sweep runs every five minutes.
    enabled: true
    triggers:
      - id: t1
        source: Test webhook
        eventTypes: [webhook.item.created]
        describe: An item was created
        enabled: true
    schedules:
      - { id: s1, cron: '*/5 * * * *', timezone: UTC, catchUp: skip, enabled: true }
    batching: { debounceSeconds: 5, maxSize: 20, maxAgeSeconds: 60 }
    gates:
      approval: none
      breaker: { threshold: 3, cooldownMinutes: 10 }
    budgets:
      runsPerHour: 30
      meterCeilings:
        hourly_runs: { events: 80, sweeps: 95 }
    executor:
      instance: Log
      target: { label: demo, outcome: ok }
    input: |
      { "mode": mode, "runId": run.id, "items": events.attributes.title }
    before: []
    after: []
    notify: []
    trackingDeadlineMinutes: 10
